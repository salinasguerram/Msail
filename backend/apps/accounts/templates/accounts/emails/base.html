<!doctype html>
<html lang="{% block lang %}es{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSAIL LEAGUE</title>
</head>
<body style="margin:0;padding:0;background:#050b18;font-family:Helvetica,Arial,sans-serif;color:#e6edf7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#050b18;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#0b1730;border:1px solid #1c2c4d;border-radius:16px;">
          <tr>
            <td style="padding:28px 32px 8px;font-size:20px;font-weight:bold;letter-spacing:2px;color:#ffffff;">
              MSAIL <span style="color:#2f8cff;">LEAGUE</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px;font-size:15px;line-height:1.6;color:#c4d0e3;">
              {% block content %}{% endblock %}
              <div style="margin:28px 0;padding:18px;background:#050b18;border:1px solid #2f8cff;border-radius:12px;text-align:center;font-size:34px;font-weight:bold;letter-spacing:10px;color:#ffffff;">
                {{ code }}
              </div>
              {% block footer %}{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
